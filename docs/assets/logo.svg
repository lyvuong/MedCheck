<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="shieldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Shield Shape Background -->
  <path d="M50 10 C68 10, 84 17, 84 29 C84 59, 68 81, 50 88 C32 81, 16 59, 16 29 C16 17, 32 10, 50 10 Z"
        fill="url(#shieldBg)"
        stroke="url(#shieldStroke)"
        stroke-width="3"
        stroke-linejoin="round"/>

  <!-- Medical Cross -->
  <path d="M43 30 H57 C58.1 30 59 30.9 59 32 V43 H70 C71.1 43 72 43.9 72 45 V55 C72 56.1 71.1 57 70 57 H59 V68 C59 69.1 58.1 70 57 70 H43 C41.9 70 41 69.1 41 68 V57 H30 C28.9 57 28 56.1 28 55 V45 C28 43.9 28.9 43 30 43 H41 V32 C41 30.9 41.9 30 43 30 Z"
        fill="url(#crossGrad)"
        opacity="0.85"/>

  <!-- Dynamic Verification Checkmark -->
  <path d="M35 50 L46 62 L69 36"
        fill="none"
        stroke="url(#checkGrad)"
        stroke-width="6.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)"/>
</svg>
