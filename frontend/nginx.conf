server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API requests go to the backend container. The frontend calls
    # /api/... (see vite.config.ts's dev proxy and src/api.ts's
    # VITE_API_BASE default) so this must match that prefix.
    location /api/ {
        proxy_pass http://backend:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service worker and manifest must never be cached long-term, or
    # PWA updates won't reach installed devices.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        expires off;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        expires off;
    }

    # Single-page app: any unmatched route serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
