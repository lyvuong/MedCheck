services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?set a long random JWT_SECRET in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      WENO_API_BASE_URL: ${WENO_API_BASE_URL:-}
      WENO_API_KEY: ${WENO_API_KEY:-}
      FIRESTORE_PROJECT_ID: ${FIRESTORE_PROJECT_ID:?set your Firebase project ID in .env}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
      PORT: 4000
    volumes:
      # Download a service-account key from Firebase console > Project
      # settings > Service accounts, and point FIREBASE_SERVICE_ACCOUNT_PATH
      # at it in your .env. Never commit this file.
      - ${FIREBASE_SERVICE_ACCOUNT_PATH:?set the path to your Firebase service-account JSON in .env}:/run/secrets/firebase-service-account.json:ro

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"
